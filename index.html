<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PlonkBot — Physics Ragdoll Platformer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #162436;
      --ui-bg: rgba(255, 255, 255, 0.94);
      --ui-shadow: 0 8px 22px rgba(15, 35, 52, 0.18);
      --accent: #00b4d8;
      --accent-dark: #0077b6;
      --gold: #ffbe0b;
      --danger: #ef476f;
      --success: #06d6a0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #27d3cf;
      font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* TOP HUD */
    .hud-top {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 0;
      right: 0;
      padding: 0 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
      z-index: 20;
    }

    .hud-left-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--ui-bg);
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: 6px 14px 6px 8px;
      box-shadow: var(--ui-shadow);
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .hud-left-pill:active {
      transform: scale(0.95);
    }

    .back-chevron {
      color: #0096c7;
      font-weight: 700;
      font-size: 18px;
      line-height: 1;
      padding-left: 2px;
    }

    .progress-ring-wrap {
      position: relative;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .progress-ring-wrap svg {
      width: 34px;
      height: 34px;
      transform: rotate(-90deg);
    }

    .level-num-badge {
      position: absolute;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }

    .level-title-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.3px;
    }

    .hud-right-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      pointer-events: none;
    }

    .hud-right-row {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--ui-bg);
      border: 2.5px solid var(--ink);
      box-shadow: var(--ui-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
      transition: transform 0.1s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* Skin Card matching Plonky's top-right character card */
    .skin-card-btn {
      pointer-events: auto;
      position: relative;
      width: 66px;
      height: 78px;
      background: #f5efe6;
      border: 2.5px solid var(--ink);
      border-radius: 10px;
      box-shadow: var(--ui-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
      transition: transform 0.12s ease;
    }

    .skin-card-btn:active {
      transform: scale(0.94);
    }

    .skin-card-tag {
      position: absolute;
      bottom: -9px;
      background: var(--ink);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.4px;
    }

    /* STAGE HINT TOAST */
    .hint-banner {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 36, 54, 0.84);
      color: #ffffff;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      text-align: center;
      max-width: min(88vw, 480px);
      z-index: 15;
    }

    .hint-banner.visible {
      opacity: 1;
    }

    /* BOTTOM TOUCH CONTROLS (Exact 4 Outlined Plonky Buttons) */
    .controls-bar {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 20;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: clamp(14px, 4vw, 28px);
      pointer-events: auto;
    }

    .ctrl-btn {
      width: clamp(62px, 16vw, 76px);
      height: clamp(62px, 16vw, 76px);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.16);
      border: 2px solid rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      transition: transform 0.08s ease, background 0.08s ease;
    }

    .ctrl-btn.pressed,
    .ctrl-btn:active {
      transform: scale(0.91);
      background: rgba(255, 255, 255, 0.34);
    }

    .ctrl-btn svg {
      width: 38px;
      height: 38px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.28));
    }

    /* MODALS */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 28, 44, 0.62);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 40;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 3px solid var(--ink);
      border-radius: 24px;
      padding: 22px 20px;
      box-shadow: 0 18px 40px rgba(10, 22, 36, 0.35);
      text-align: center;
      color: var(--ink);
      max-height: 86dvh;
      overflow-y: auto;
    }

    .modal-title {
      margin: 0 0 6px;
      font-size: 26px;
      font-weight: 700;
    }

    .modal-sub {
      margin: 0 0 18px;
      font-size: 14px;
      color: #4f6478;
    }

    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .primary-btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: 2.5px solid var(--ink);
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 0.08s ease;
    }

    .primary-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--ink);
    }

    .secondary-btn {
      width: 100%;
      padding: 12px 18px;
      border-radius: 14px;
      border: 2.5px solid var(--ink);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: #f1f5f9;
      color: var(--ink);
      box-shadow: 0 4px 0 var(--ink);
    }

    .secondary-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--ink);
    }

    .levels-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .lvl-cell {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 2.5px solid var(--ink);
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #e2e8f0;
      color: #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 var(--ink);
    }

    .lvl-cell.unlocked {
      background: #ffffff;
      color: var(--ink);
    }

    .lvl-cell.completed {
      background: #d8f8ee;
      color: #066e52;
    }

    .lvl-cell.current {
      background: var(--gold);
      color: var(--ink);
    }

    .skins-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .skin-option {
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 12px 10px;
      background: #f8fafc;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-weight: 700;
      color: var(--ink);
      box-shadow: 0 3px 0 var(--ink);
    }

    .skin-option.selected {
      background: #e0f7fa;
      border-color: #0077b6;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>

    <!-- TOP HUD -->
    <div class="hud-top">
      <button class="hud-left-pill" id="btnLevelSelect" aria-label="Stage Select">
        <span class="back-chevron">&#10094;</span>
        <div class="progress-ring-wrap">
          <svg viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="14" fill="none" stroke="#dbeafe" stroke-width="4"></circle>
            <circle id="progressCircle" cx="18" cy="18" r="14" fill="none" stroke="#0096c7" stroke-width="4" stroke-dasharray="88" stroke-dashoffset="44" stroke-linecap="round"></circle>
          </svg>
          <span class="level-num-badge" id="hudLevelNum">1</span>
        </div>
        <span class="level-title-text" id="hudLevelName">STAGE 1</span>
      </button>

      <div class="hud-right-col">
        <div class="hud-right-row">
          <button class="icon-btn" id="btnQuickRestart" aria-label="Restart Stage" title="Restart Stage (R)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
          </button>
          <button class="icon-btn" id="btnPause" aria-label="Pause Game" title="Pause (P)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <rect x="5" y="4" width="5" height="16" rx="2"></rect>
              <rect x="14" y="4" width="5" height="16" rx="2"></rect>
            </svg>
          </button>
        </div>

        <!-- Avatar Skin Card (Plonky style) -->
        <button class="skin-card-btn" id="btnSkinModal" aria-label="Customize PlonkBot">
          <canvas id="skinPreviewCanvas" width="48" height="54"></canvas>
          <span class="skin-card-tag">BOT</span>
        </button>
      </div>
    </div>

    <!-- Stage Tip Banner -->
    <div class="hint-banner" id="hintBanner"></div>

    <!-- BOTTOM ON-SCREEN CONTROLS -->
    <div class="controls-bar">
      <div class="ctrl-group">
        <button class="ctrl-btn" id="btnLeft" aria-label="Move Left">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M31 10L13 24L31 38Z" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="btnRight" aria-label="Move Right">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M17 10L35 24L17 38Z" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="ctrl-group">
        <button class="ctrl-btn" id="btnDown" aria-label="Crouch or Climb Down">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M10 17L24 35L38 17Z" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="btnUp" aria-label="Jump or Climb Up">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M10 31L24 13L38 31Z" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- PAUSE MODAL -->
    <div class="modal-backdrop" id="pauseModal">
      <div class="modal-card">
        <h2 class="modal-title">PAUSED</h2>
        <p class="modal-sub" id="pauseStageLabel">Stage 1 — PlonkBot</p>
        <div class="btn-stack">
          <button class="primary-btn" id="btnResume">RESUME</button>
          <button class="secondary-btn" id="btnModalRestart">RESTART STAGE</button>
          <button class="secondary-btn" id="btnToggleSound">SOUND: ON</button>
          <button class="secondary-btn" id="btnOpenStagesFromPause">SELECT STAGE</button>
        </div>
      </div>
    </div>

    <!-- STAGE SELECT MODAL -->
    <div class="modal-backdrop" id="stagesModal">
      <div class="modal-card">
        <h2 class="modal-title">SELECT STAGE</h2>
        <p class="modal-sub">15 Extended Contraption Stages</p>
        <div class="levels-grid" id="levelsGrid"></div>
        <button class="secondary-btn" id="btnCloseStages">CLOSE</button>
      </div>
    </div>

    <!-- SKIN SELECTOR MODAL -->
    <div class="modal-backdrop" id="skinsModal">
      <div class="modal-card">
        <h2 class="modal-title">PLONKBOT CHASSIS</h2>
        <p class="modal-sub">Choose your droid paint &amp; visor style</p>
        <div class="skins-grid" id="skinsGrid"></div>
        <button class="primary-btn" id="btnCloseSkins">EQUIP &amp; PLAY</button>
      </div>
    </div>

    <!-- STAGE CLEAR MODAL -->
    <div class="modal-backdrop" id="winModal">
      <div class="modal-card">
        <h2 class="modal-title">STAGE CLEAR!</h2>
        <p class="modal-sub" id="winSummary">PlonkBot crossed the goal portal!</p>
        <div class="btn-stack">
          <button class="primary-btn" id="btnNextStage">NEXT STAGE &#10140;</button>
          <button class="secondary-btn" id="btnReplayStage">REPLAY STAGE</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      // =========================================================================
      // 1. PERSISTENCE & CONFIG
      // =========================================================================
      const STORAGE_KEY = 'plonkbot_adventure_v2';

      const SKINS = [
        {
          id: 'mint',
          name: 'Mint Scout',
          body: '#ffffff',
          trim: '#00b4d8',
          visor: '#132238',
          eye: '#38f2ff',
          boots: '#0077b6'
        },
        {
          id: 'crimson',
          name: 'Crimson Striker',
          body: '#ffe5ec',
          trim: '#ef476f',
          visor: '#1b1325',
          eye: '#ffbe0b',
          boots: '#b5173e'
        },
        {
          id: 'solar',
          name: 'Solar Gold',
          body: '#fff8db',
          trim: '#ff9f1c',
          visor: '#1d1e2c',
          eye: '#06d6a0',
          boots: '#d97706'
        },
        {
          id: 'cyber',
          name: 'Cyber Violet',
          body: '#f3e8ff',
          trim: '#8338ec',
          visor: '#141124',
          eye: '#ff4d94',
          boots: '#5a189a'
        }
      ];

      function loadSave() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            return {
              unlockedLevel: Math.max(1, Math.min(15, parsed.unlockedLevel || 1)),
              completedLevels: Array.isArray(parsed.completedLevels) ? parsed.completedLevels : [],
              selectedSkin: parsed.selectedSkin || 'mint',
              muted: Boolean(parsed.muted)
            };
          }
        } catch (err) {
          // Ignore storage restrictions
        }
        return {
          unlockedLevel: 1,
          completedLevels: [],
          selectedSkin: 'mint',
          muted: false
        };
      }

      const saveState = loadSave();

      function persistSave() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(saveState));
        } catch (err) {
          // Ignore storage restrictions
        }
      }

      // =========================================================================
      // 2. PROCEDURAL WEB AUDIO ENGINE
      // =========================================================================
      let audioCtx = null;

      function ensureAudio() {
        if (saveState.muted) return null;
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function playTone(freqStart, freqEnd, duration, type = 'sine', volume = 0.14) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + duration);

        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      const SoundFX = {
        jump: () => playTone(230, 510, 0.15, 'triangle', 0.16),
        spring: () => playTone(180, 780, 0.24, 'sine', 0.18),
        land: () => playTone(130, 55, 0.09, 'sine', 0.12),
        switchOn: () => playTone(440, 660, 0.12, 'square', 0.1),
        checkpoint: () => {
          playTone(523, 659, 0.1, 'triangle', 0.14);
          setTimeout(() => playTone(784, 1046, 0.16, 'triangle', 0.15), 80);
        },
        cannon: () => playTone(140, 42, 0.28, 'sawtooth', 0.2),
        bumper: () => playTone(340, 740, 0.14, 'sine', 0.16),
        crumble: () => playTone(160, 70, 0.18, 'square', 0.11),
        ropeGrab: () => playTone(180, 290, 0.08, 'sine', 0.12),
        arrowShoot: () => playTone(560, 240, 0.12, 'triangle', 0.13),
        laserShoot: () => playTone(880, 210, 0.16, 'sawtooth', 0.14),
        hurt: () => playTone(190, 58, 0.3, 'sawtooth', 0.18),
        win: () => {
          playTone(392, 523, 0.14, 'triangle', 0.16);
          setTimeout(() => playTone(523, 659, 0.14, 'triangle', 0.16), 110);
          setTimeout(() => playTone(659, 784, 0.26, 'triangle', 0.18), 220);
        }
      };

      // =========================================================================
      // 3. EXTENDED MULTI-SECTION LEVEL DEFINITIONS (15 DISTINCT STAGES)
      // =========================================================================
      const LEVELS = [
        // STAGE 1: Classic Plonky Opening — Tilting Bridges + Boulder Pit
        {
          name: 'STAGE 1',
          theme: 'tropical',
          hint: 'Walk across the tilting wooden ramp, then roll the boulder into the ditch!',
          spawn: { x: 110, y: 310 },
          checkpoints: [{ x: 1280, y: 360 }],
          goal: { x: 2480, y: 310 },
          trees: [
            { x: 60, y: 370, scale: 1.0 },
            { x: 1320, y: 360, scale: 0.9 },
            { x: 2380, y: 360, scale: 1.05 }
          ],
          platforms: [
            { x: 0, y: 370, w: 460, h: 480, type: 'earth' },
            { x: 760, y: 385, w: 320, h: 480, type: 'earth' },
            { x: 1220, y: 360, w: 680, h: 480, type: 'earth' },
            { x: 1900, y: 445, w: 125, h: 395, type: 'earth' },
            { x: 2025, y: 360, w: 560, h: 480, type: 'earth' }
          ],
          bridges: [
            { x: 610, y: 378, length: 320, thickness: 22, angle: -0.14, minAngle: -0.35, maxAngle: 0.35 },
            { x: 1150, y: 372, length: 180, thickness: 22, angle: 0.08, minAngle: -0.3, maxAngle: 0.3 }
          ],
          balls: [
            { x: 1580, y: 324, r: 36, mass: 3.4 }
          ],
          crates: [],
          ropes: [],
          springs: [],
          movers: [],
          crushers: [],
          fans: [],
          conveyors: [],
          cannons: [],
          fragiles: [],
          bumpers: [],
          switches: [],
          gates: [],
          hazards: [],
          shooters: [
            { type: 'bow', x: 1120, y: 315, dir: -1, interval: 2.3, timer: 1.0, speed: 340 }
          ],
          pendulums: []
        },

        // STAGE 2: Tarzan Rope Swing, Fragile Bridges & Crate Steps
        {
          name: 'STAGE 2',
          theme: 'tropical',
          hint: 'Grab ANYWHERE on the swinging ropes! Watch out for crumbling wooden planks!',
          spawn: { x: 110, y: 310 },
          checkpoints: [{ x: 1380, y: 370 }],
          goal: { x: 2660, y: 310 },
          trees: [
            { x: 60, y: 370, scale: 1.0 },
            { x: 1420, y: 370, scale: 0.95 },
            { x: 2560, y: 360, scale: 1.05 }
          ],
          platforms: [
            { x: 0, y: 370, w: 420, h: 480, type: 'earth' },
            { x: 760, y: 390, w: 280, h: 480, type: 'earth' },
            { x: 1320, y: 370, w: 460, h: 480, type: 'earth' },
            { x: 2220, y: 360, w: 540, h: 480, type: 'earth' }
          ],
          bridges: [],
          balls: [],
          crates: [
            { x: 1580, y: 330, w: 56, h: 56 },
            { x: 1655, y: 330, w: 56, h: 56 }
          ],
          ropes: [
            { anchorX: 590, anchorY: 85, length: 255, amp: 0.58, speed: 2.3, phase: 0 },
            { anchorX: 1180, anchorY: 80, length: 260, amp: 0.62, speed: 2.4, phase: 1.2 },

      // =========================================================================
      // 5. COLLISION & PHYSICS STEP (FIXED 60HZ)
      // =========================================================================
      const GRAVITY = 1280;

      function circleRectResolve(cx, cy, cr, rx, ry, rw, rh) {
        const closestX = Math.max(rx, Math.min(cx, rx + rw));
        const closestY = Math.max(ry, Math.min(cy, ry + rh));
        const dx = cx - closestX;
        const dy = cy - closestY;
        const distSq = dx * dx + dy * dy;

        if (distSq >= cr * cr) return null;

        const dist = Math.sqrt(distSq);
        if (dist > 0.0001) {
          return {
            nx: dx / dist,
            ny: dy / dist,
            overlap: cr - dist
          };
        }

        const leftPen = cx - rx;
        const rightPen = rx + rw - cx;
        const topPen = cy - ry;
        const bottomPen = ry + rh - cy;
        const minPen = Math.min(leftPen, rightPen, topPen, bottomPen);
        if (minPen === topPen) return { nx: 0, ny: -1, overlap: cr + topPen };
        if (minPen === bottomPen) return { nx: 0, ny: 1, overlap: cr + bottomPen };
        if (minPen === leftPen) return { nx: -1, ny: 0, overlap: cr + leftPen };
        return { nx: 1, ny: 0, overlap: cr + rightPen };
      }

      function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
        return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
      }

      function pointToSegmentInfo(px, py, ax, ay, bx, by) {
        const abx = bx - ax;
        const aby = by - ay;
        const lenSq = abx * abx + aby * aby;
        if (lenSq < 0.0001) return { dist: Math.hypot(px - ax, py - ay), along: 0 };
        const t = Math.max(0.12, Math.min(1.0, ((px - ax) * abx + (py - ay) * aby) / lenSq));
        const closestX = ax + abx * t;
        const closestY = ay + aby * t;
        return {
          dist: Math.hypot(px - closestX, py - closestY),
          along: t * Math.sqrt(lenSq)
        };
      }

      function triggerPlayerDeath() {
        if (player.dead || levelWon) return;
        player.dead = true;
        player.grabbedRope = null;
        player.inCannon = null;
        player.deadTimer = 0.85;
        player.vy = -380;
        player.vx = -player.facing * 180;
